[package]
name = "battle_tanks"
version = "0.7.9"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
# Only for `Icon` (window/taskbar icon); same version Bevy already builds.
winit = { version = "0.30", default-features = false }
bevy = { version = "0.20.1", default-features = false, features = ["2d", "ui", "bevy_audio", "wav", "vorbis", "png"] }

# Fast-enough debug builds: our code lightly optimised, dependencies fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
