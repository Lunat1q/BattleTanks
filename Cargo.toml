[package]
name = "battle_tanks"
version = "0.3.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
# Only for `Icon` (window/taskbar icon); same version Bevy already builds.
winit = { version = "0.30", default-features = false }
bevy = { version = "0.20.1", default-features = false, features = ["2d", "ui", "bevy_audio", "wav", "vorbis", "png"] }

# Android TV (ADR 0006): GameActivity host. Rendering is Vulkan only (bevy_render's wgpu backends).
# ponytail: no GLES fallback; if a TV box lacks Vulkan, add `wgpu = { version = "30", default-features = false, features = ["gles"] }` here.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["android-game-activity"] }

# Fast-enough debug builds: our code lightly optimised, dependencies fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
